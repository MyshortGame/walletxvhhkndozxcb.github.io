<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0907">
<title>Daftar Akun - MyShort App</title>
<link rel="stylesheet" href="premium-brand.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;padding:20px;display:flex;justify-content:center;align-items:center;color:#f7f2e6;position:relative;overflow-x:hidden;background:radial-gradient(circle at 50% -10%,rgba(226,178,67,.30),transparent 34%),radial-gradient(circle at 0% 100%,rgba(151,105,24,.16),transparent 32%),linear-gradient(145deg,#18140d 0%,#0b0a08 45%,#050505 100%)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background-image:radial-gradient(circle,#f4cf72 .55px,transparent .65px);background-size:20px 20px}
body:after{content:"";position:fixed;width:520px;height:520px;border:1px solid rgba(232,189,88,.12);border-radius:50%;top:-300px;left:50%;transform:translateX(-50%);box-shadow:0 0 0 45px rgba(232,189,88,.025),0 0 0 90px rgba(232,189,88,.018);pointer-events:none}
.container{width:100%;max-width:390px;padding:31px 28px 27px;border-radius:24px;border:1px solid rgba(232,189,88,.30);background:linear-gradient(145deg,rgba(35,31,22,.98),rgba(13,13,12,.98));box-shadow:0 25px 70px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,235,170,.08);position:relative;z-index:1}
.container:before{content:"";position:absolute;inset:7px;border:1px solid rgba(232,189,88,.08);border-radius:19px;pointer-events:none}
.logo{text-align:center;margin-bottom:23px;position:relative;z-index:2}
.logo-mark{width:68px;height:68px;margin:0 auto 12px;display:grid;place-items:center;overflow:hidden;border-radius:20px;border:1px solid #d8a83f;color:#ffe8a3;font-size:25px;font-weight:900;letter-spacing:-1px;background:linear-gradient(145deg,#2c2414,#0e0d0a);box-shadow:0 8px 25px rgba(0,0,0,.45),inset 0 0 20px rgba(232,189,88,.08),0 0 25px rgba(216,168,63,.10)}
.logo-mark img{display:block;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;border-radius:inherit;padding:7px}
.logo h2{font-size:22px;color:#ffe29a;letter-spacing:.2px}
.logo p{margin-top:5px;color:#85817a;font-size:10px}
.input-group{margin-bottom:14px;position:relative;z-index:2}
label{display:block;margin-bottom:7px;color:#b8b1a2;font-size:11px;font-weight:bold}
input{width:100%;padding:13px;border:1px solid #3a352b;border-radius:10px;outline:none;background:rgba(9,9,8,.82);color:#f7f2e6;font-size:14px;transition:.2s;box-shadow:inset 0 1px 5px rgba(0,0,0,.25)}
input::placeholder{color:#5f5c57}
input:focus{border-color:#d8a83f;box-shadow:0 0 0 2px rgba(216,168,63,.10),inset 0 1px 5px rgba(0,0,0,.25)}
button{width:100%;margin-top:5px;padding:14px;border:1px solid #e7bd5d;border-radius:10px;color:#1a1408;background:linear-gradient(135deg,#ffe7a0 0%,#e8bd58 48%,#c58b24 100%);font-size:14px;font-weight:900;letter-spacing:.3px;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.35);transition:.2s;position:relative;z-index:2}
button:hover{transform:translateY(-1px);filter:brightness(1.06)}
button:active{transform:translateY(0)}
.success{margin-top:15px;padding:10px;display:none;text-align:center;border:1px solid #315c3d;border-radius:9px;background:#102016;color:#8fe0a5;font-size:11px;font-weight:bold}
.error{margin-top:15px;padding:10px;display:none;text-align:center;border:1px solid #63352f;border-radius:9px;background:#211311;color:#ffaaa0;font-size:11px;font-weight:bold}
.bottom{margin-top:21px;padding-top:17px;border-top:1px solid #29261f;text-align:center;color:#77736b;font-size:11px;position:relative;z-index:2}
.bottom a{color:#f0c85f;text-decoration:none;font-weight:bold}
.bottom a:hover{color:#ffe39a}
@media(max-width:430px){body{padding:14px}.container{padding:28px 22px 24px}}


/* MyShort premium dark-blue embossed styling: visual-only overrides */
:root{color-scheme:dark}
body{
 color:#edf5ff!important;
 background:
  radial-gradient(ellipse at 50% 0%,rgba(69,137,216,.24),transparent 43%),
  radial-gradient(circle at 0% 100%,rgba(42,102,174,.16),transparent 32%),
  linear-gradient(155deg,#030914 0%,#091a30 52%,#06101e 100%)!important;
}
body:before{opacity:.08;background-image:radial-gradient(circle,rgba(170,210,255,.65) .55px,transparent .7px)!important}
body:after{border-color:rgba(133,184,242,.12)!important;box-shadow:0 0 0 45px rgba(98,155,220,.025),0 0 0 90px rgba(98,155,220,.018)!important}
.container{
 border:1px solid rgba(135,184,242,.38)!important;
 background:linear-gradient(145deg,#142d4b 0%,#0c1e35 54%,#08162a 100%)!important;
 box-shadow:12px 14px 28px rgba(0,0,0,.50),-7px -7px 20px rgba(69,118,176,.16),inset 2px 2px 4px rgba(213,234,255,.10),inset -2px -2px 5px rgba(0,0,0,.40)!important;
}
.container:before{border-color:rgba(151,196,250,.13)!important}
.logo-mark{
 color:#c7e3ff!important;border:1px solid rgba(143,197,255,.50)!important;
 background:linear-gradient(145deg,#18395f,#0b1b31)!important;
 box-shadow:6px 6px 13px rgba(0,0,0,.42),-4px -4px 10px rgba(93,143,201,.12),inset 1px 1px 2px rgba(220,238,255,.15),inset -2px -2px 4px rgba(0,0,0,.25)!important;
}
.logo h2{color:#eef6ff!important}
.logo p{color:#91a9c6!important}
label{color:#c4d7ef!important}
input{
 color:#f1f7ff!important;background:linear-gradient(145deg,#071629,#0b1a2e)!important;
 border:1px solid rgba(126,176,234,.28)!important;border-radius:13px!important;
 box-shadow:inset 5px 5px 11px rgba(0,0,0,.52),inset -4px -4px 9px rgba(69,116,169,.15),0 1px 0 rgba(206,229,255,.04)!important;
}
input::placeholder{color:#7892b2!important}
input:focus{border-color:rgba(143,197,255,.78)!important;box-shadow:inset 4px 4px 8px rgba(0,0,0,.42),0 0 0 3px rgba(88,157,229,.16)!important}
button{
 color:#07172a!important;background:linear-gradient(145deg,#b4dcff 0%,#7bb8f5 52%,#4f91d7 100%)!important;
 border:1px solid rgba(210,235,255,.55)!important;border-radius:13px!important;
 box-shadow:7px 8px 16px rgba(1,7,17,.45),-4px -4px 12px rgba(63,119,179,.13),inset 2px 2px 3px rgba(255,255,255,.42),inset -2px -2px 4px rgba(29,76,124,.18)!important;
}
button:active{transform:translateY(2px)!important;box-shadow:inset 4px 4px 8px rgba(12,45,78,.25)!important}
.bottom{border-top-color:rgba(112,166,225,.18)!important;color:#91a7c1!important}
.bottom a{color:#9bcaff!important}
.success{background:#0e2a22!important;border-color:#286d56!important}
.error{background:#2a1720!important;border-color:#784252!important}

</style>
</head>
<body>
<div class="container">
<div class="logo">
<div class="logo-mark"><img class="sp-logo" src="logo.png" alt="MyShort Logo"></div>
<h>BUAT AKUN</h>
<p>Bergabung dengan MyShort App</p>
</div>
<div class="input-group">
<label>Nama Lengkap</label>
<input type="text" id="nama" placeholder="Masukkan Nama" autocomplete="name">
</div>
<div class="input-group">
<label>Email</label>
<input type="email" id="email" placeholder="Masukkan Email" autocomplete="email">
</div>
<div class="input-group">
<label>Nomor HP</label>
<input type="text" id="hp" placeholder="08xxxxxxxxxx" autocomplete="tel">
</div>
<div class="input-group">
<label>Password</label>
<input type="password" id="password" placeholder="Minimal 6 karakter" autocomplete="new-password">
</div>
<div class="input-group">
<label>Kode Referral (Opsional)</label>
<input type="text" id="referral" placeholder="Masukkan kode referral" autocomplete="off">
</div>
<button onclick="register()">DAFTAR SEKARANG</button>
<p class="success" id="success">Pendaftaran berhasil.</p>
<p class="error" id="error">Semua data wajib diisi.</p>
<div class="bottom">Sudah punya akun? <a href="index.html">Login</a></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
<script src="pages.js"></script>
</body>
</html>
