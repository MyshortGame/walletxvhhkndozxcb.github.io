<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090a0d">
  <meta name="description" content="MyShort">
  <title>MyShort</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0}
    body{
      min-height:100vh;min-height:100dvh;
      display:flex;align-items:center;justify-content:center;
      overflow:hidden;background:#090a0d;color:#f5f5f5;
      font-family:Inter,Roboto,Arial,sans-serif;
    }
    .splash{
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:13px;padding:24px;text-align:center;
      animation:appear .7s ease both;
    }
    .logo{
      width:66px;height:66px;object-fit:contain;display:block;
      filter:drop-shadow(0 5px 18px rgba(239,145,45,.18));
    }
    .brand{
      margin:0;color:#f2f2f2;font-size:25px;font-weight:750;
      letter-spacing:1.4px;line-height:1.15;
    }
    @keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
    @media(prefers-reduced-motion:reduce){.splash{animation:none}}
  </style>
</head>
<body>
  <main class="splash" aria-label="MyShort">
    <img class="logo" src="logo.png" alt="Logo MyShort">
    
  </main>
  <script>
    // Layar pembuka singkat, lalu lanjut ke halaman login.
    window.setTimeout(function(){
      window.location.replace('login.html');
    }, 1800);
  </script>
</body>
</html>
