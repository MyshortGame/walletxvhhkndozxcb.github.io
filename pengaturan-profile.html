<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#06101f">
<title>Pengaturan Profile - MyShort</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Roboto,Arial,sans-serif;
  background:#06101f;
  color:#eef6ff;
}

body{
  padding-bottom:90px;
}

a{
  text-decoration:none;
  color:inherit;
}

.page{
  width:min(100%,620px);
  margin:0 auto;
  padding:18px 15px 30px;
}

.topbar{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}

.back{
  width:42px;
  height:42px;
  border-radius:13px;
  border:1px solid rgba(255,255,255,.09);
  background:#0c1b2e;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  color:#dbeaff;
}

.top-title{
  font-size:20px;
  font-weight:800;
}

.top-sub{
  font-size:12px;
  color:#8fa5bd;
  margin-top:3px;
}

.card{
  background:linear-gradient(145deg,#0d1e32,#091727);
  border:1px solid rgba(49,135,232,.18);
  border-radius:20px;
  padding:18px;
  box-shadow:0 12px 35px rgba(0,0,0,.22);
}

.profile-head{
  display:flex;
  align-items:center;
  gap:13px;
  padding-bottom:17px;
  margin-bottom:17px;
  border-bottom:1px solid rgba(255,255,255,.07);
}

.avatar{
  width:52px;
  height:52px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#3187e8,#1760ae);
  font-size:25px;
  font-weight:900;
  box-shadow:0 8px 20px rgba(49,135,232,.2);
}

.head-title{
  font-size:17px;
  font-weight:800;
}

.head-desc{
  font-size:12px;
  color:#8fa5bd;
  margin-top:4px;
}

.field{
  margin-top:14px;
}

.label{
  display:block;
  font-size:12px;
  font-weight:700;
  color:#9eb2c8;
  margin-bottom:7px;
}

.input{
  width:100%;
  height:48px;
  padding:0 14px;
  border-radius:13px;
  border:1px solid rgba(255,255,255,.09);
  background:#071321;
  color:#f5f9ff;
  font-size:15px;
  outline:none;
  transition:.2s;
}

.input:focus{
  border-color:#3187e8;
  box-shadow:0 0 0 3px rgba(49,135,232,.12);
}

.input::placeholder{
  color:#627991;
}

.readonly{
  opacity:.65;
  cursor:not-allowed;
}

.save{
  width:100%;
  height:50px;
  border:0;
  border-radius:14px;
  margin-top:20px;
  background:linear-gradient(135deg,#3187e8,#1760ae);
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 10px 25px rgba(49,135,232,.2);
}

.save:disabled{
  opacity:.55;
  cursor:wait;
}

.msg{
  display:none;
  margin-top:13px;
  padding:12px 13px;
  border-radius:12px;
  font-size:13px;
  line-height:1.45;
}

.msg.show{
  display:block;
}

.msg.ok{
  background:rgba(30,180,110,.12);
  border:1px solid rgba(30,180,110,.25);
  color:#9cf0c5;
}

.msg.err{
  background:rgba(230,75,75,.12);
  border:1px solid rgba(230,75,75,.25);
  color:#ffb1b1;
}

.note{
  margin-top:14px;
  padding:12px 13px;
  border-radius:12px;
  background:rgba(49,135,232,.07);
  border:1px solid rgba(49,135,232,.12);
  font-size:11px;
  line-height:1.55;
  color:#91a8c0;
}

.note b{
  color:#c8def5;
}

.bottom{
  position:fixed;
  left:50%;
  bottom:10px;
  transform:translateX(-50%);
  width:min(calc(100% - 22px),600px);
  height:62px;
  border-radius:19px;
  background:rgba(8,20,34,.96);
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(12px);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  z-index:20;
  box-shadow:0 12px 35px rgba(0,0,0,.35);
}

.nav{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:10px;
  color:#7f95ab;
}

.nav-icon{
  font-size:19px;
  line-height:1;
}

.nav.active{
  color:#55a4ff;
  font-weight:700;
}

.loading{
  opacity:.6;
}
</style>
</head>

<body>

<div class="page">

  <div class="topbar">
    <a class="back" href="profile.html" aria-label="Kembali">‹</a>

    <div>
      <div class="top-title">Pengaturan Profile</div>
      <div class="top-sub">Kelola nama dan nomor HP / telepon</div>
    </div>
  </div>

  <section class="card">

    <div class="profile-head">
      <div class="avatar">⚙</div>

      <div>
        <div class="head-title">Data Member</div>
        <div class="head-desc">
          Perubahan disimpan ke profile MyShort Anda.
        </div>
      </div>
    </div>

    <div class="field">
      <label class="label" for="fullName">
        Nama Lengkap
      </label>

      <input
        class="input"
        id="fullName"
        type="text"
        maxlength="100"
        autocomplete="name"
        placeholder="Masukkan nama lengkap"
      >
    </div>

    <div class="field">
      <label class="label" for="phone">
        Nomor HP / Telepon
      </label>

      <input
        class="input"
        id="phone"
        type="tel"
        maxlength="25"
        autocomplete="tel"
        inputmode="tel"
        placeholder="Contoh: 081234567890"
      >
    </div>

    <div class="field">
      <label class="label" for="email">
        Email
      </label>

      <input
        class="input readonly"
        id="email"
        type="email"
        readonly
      >
    </div>

    <button
      class="save"
      id="saveBtn"
      type="button"
    >
      SIMPAN PERUBAHAN
    </button>

    <div class="msg" id="message"></div>

    <div class="note">
      <b>Catatan:</b>
      Email tidak diubah di halaman ini.
      Nama dan nomor HP / telepon diperbarui pada tabel
      <b>profiles</b> sesuai akun yang sedang login.
    </div>

  </section>

</div>

<nav class="bottom">

  <a class="nav" href="dashboard.html">
    <span class="nav-icon">⌂</span>
    <span>Home</span>
  </a>

  <a class="nav" href="mission.html">
    <span class="nav-icon">◉</span>
    <span>Mission</span>
  </a>

  <a class="nav" href="market.html">
    <span class="nav-icon">↗</span>
    <span>market</span>
  </a>

  <a class="nav active" href="profile.html">
    <span class="nav-icon">♙</span>
    <span>Profile</span>
  </a>

</nav>

<!-- SUPABASE JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- KONFIGURASI MYSHORT -->
<script src="supabase-config.js"></script>

<script>
(function(){

  const $ = id => document.getElementById(id);

  /*
   * PENTING:
   * Supabase client yang benar dibuat oleh supabase-config.js
   * dan disimpan di window.sb.
   *
   * Jangan menggunakan window.supabase karena itu adalah
   * library Supabase, bukan client yang sudah terhubung.
   */
  const sb = window.sb;

  let currentUser = null;

  function show(type,text){

    const el = $("message");

    el.className = "msg show " + type;

    el.textContent = text;

  }

  function clearMessage(){

    const el = $("message");

    el.className = "msg";

    el.textContent = "";

  }

  async function init(){

    try{

      clearMessage();

      if(!sb || !sb.auth){

        throw new Error(
          "Supabase client tidak ditemukan. Periksa supabase-config.js."
        );

      }

      /*
       * Gunakan fungsi currentUser() dari
       * supabase-config.js agar semua halaman MyShort
       * menggunakan sistem session yang sama.
       */
      if(typeof window.currentUser === "function"){

        currentUser = await window.currentUser();

      }else{

        const {
          data,
          error
        } = await sb.auth.getSession();

        if(error) throw error;

        currentUser =
          data &&
          data.session &&
          data.session.user
            ? data.session.user
            : null;

      }

      /*
       * Tidak ada session.
       */
      if(!currentUser){

        show(
          "err",
          "Sesi login tidak ditemukan. Silakan login terlebih dahulu."
        );

        setTimeout(
          () => location.href = "index.html",
          1200
        );

        return;

      }

      console.log(
        "[MyShort Profile] Auth User ID:",
        currentUser.id
      );

      console.log(
        "[MyShort Profile] Auth Email:",
        currentUser.email
      );

      /*
       * Ambil profile berdasarkan:
       *
       * profiles.id = auth.users.id
       *
       * Struktur database Anda memang menggunakan
       * hubungan tersebut.
       */
      const result = await sb
        .from("profiles")
        .select(
          "id,uid,username,full_name,email,phone,referral_code,status,level,xp,role"
        )
        .eq("id",currentUser.id)
        .maybeSingle();

      if(result.error){

        console.error(
          "[MyShort Profile] Supabase SELECT error:",
          result.error
        );

        throw result.error;

      }

      const p = result.data || null;

      /*
       * Jika profile tidak ditemukan.
       */
      if(!p){

        console.error(
          "[MyShort Profile] Profile tidak ditemukan untuk Auth User ID:",
          currentUser.id
        );

        show(
          "err",
          "Data profile member tidak ditemukan."
        );

        return;

      }

      /*
       * Isi form.
       */
      $("fullName").value =
        p.full_name ||
        currentUser.user_metadata?.full_name ||
        "";

      $("phone").value =
        p.phone ||
        currentUser.user_metadata?.phone ||
        "";

      $("email").value =
        p.email ||
        currentUser.email ||
        "";

      console.log(
        "[MyShort Profile] Data profile berhasil dimuat:",
        p
      );

    }catch(err){

      console.error(
        "[MyShort Pengaturan Profile]",
        err
      );

      show(
        "err",
        "Gagal memuat data profile: " +
        (
          err?.message ||
          "Kesalahan tidak diketahui"
        )
      );

    }

  }


  /*
   * SIMPAN PROFILE
   */
  $("saveBtn").addEventListener(
    "click",
    async function(){

      const name =
        $("fullName").value.trim();

      const phone =
        $("phone").value.trim();

      /*
       * Validasi nama.
       */
      if(!name){

        show(
          "err",
          "Nama lengkap wajib diisi."
        );

        $("fullName").focus();

        return;

      }

      /*
       * Validasi nomor telepon.
       */
      if(!phone){

        show(
          "err",
          "Nomor HP / telepon wajib diisi."
        );

        $("phone").focus();

        return;

      }

      /*
       * Pastikan user login.
       */
      if(!currentUser){

        show(
          "err",
          "Sesi login belum tersedia."
        );

        return;

      }

      const btn = this;

      btn.disabled = true;
      btn.textContent = "MENYIMPAN...";

      try{

        console.log(
          "[MyShort Profile] Menyimpan:",
          {
            user_id: currentUser.id,
            full_name: name,
            phone: phone
          }
        );

        /*
         * UPDATE langsung ke:
         *
         * public.profiles
         *
         * berdasarkan:
         *
         * profiles.id = currentUser.id
         */
        const result = await sb
          .from("profiles")
          .update({
            full_name: name,
            phone: phone,
            updated_at: new Date().toISOString()
          })
          .eq("id",currentUser.id)
          .select(
            "id,uid,username,full_name,email,phone,updated_at"
          )
          .maybeSingle();

        if(result.error){

          console.error(
            "[MyShort Profile] UPDATE error:",
            result.error
          );

          throw result.error;

        }

        /*
         * Kalau tidak ada data yang kembali,
         * berarti update tidak mengenai baris profile.
         */
        if(!result.data){

          throw new Error(
            "Data profile tidak berhasil diperbarui. Periksa hubungan ID akun dengan profiles."
          );

        }

        /*
         * Perbarui tampilan dengan data hasil database.
         */
        $("fullName").value =
          result.data.full_name || "";

        $("phone").value =
          result.data.phone || "";

        show(
          "ok",
          "Profile berhasil diperbarui."
        );

        console.log(
          "[MyShort Profile] UPDATE BERHASIL:",
          result.data
        );

        /*
         * Tidak langsung redirect.
         *
         * Member dapat melihat bahwa data benar-benar
         * berhasil tersimpan.
         */
        setTimeout(
          () => {
            clearMessage();
          },
          2500
        );

      }catch(err){

        console.error(
          "[MyShort Pengaturan Save]",
          err
        );

        let msg =
          err?.message ||
          "Kesalahan tidak diketahui";

        /*
         * Pesan lebih mudah dipahami untuk masalah RLS.
         */
        if(
          String(msg).toLowerCase().includes("row-level security")
        ){

          msg =
            "Tidak dapat menyimpan profile karena izin RLS Supabase menolak perubahan.";

        }

        show(
          "err",
          "Gagal menyimpan profile: " + msg
        );

      }finally{

        btn.disabled = false;
        btn.textContent = "SIMPAN PERUBAHAN";

      }

    }
  );


  /*
   * Jalankan saat halaman dibuka.
   */
  init();

})();
</script>

</body>
</html>
